<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy AI</title>
    <link rel="stylesheet"
          href="/static/css/style.css">
</head>

<body>

<div class="container">

    <h1>🏃 FitBuddy AI</h1>

    <p>
        AI-powered general wellness planner
    </p>

    <form action="/generate-workout"
          method="post">

        <label>Name</label>
        <input type="text"
               name="name"
               required>

        <label>Age</label>
        <input type="number"
               name="age"
               required>

        <label>Weight</label>
        <input type="number"
               step="0.1"
               name="weight"
               required>

        <label>Wellness Goal</label>

        <select name="goal">

            <option value="general fitness">
                General Fitness
            </option>

            <option value="strength">
                Strength
            </option>

            <option value="healthy lifestyle">
                Healthy Lifestyle
            </option>

        </select>

        <label>Activity Level</label>

        <select name="intensity">

            <option value="beginner">
                Beginner
            </option>

            <option value="moderate">
                Moderate
            </option>

            <option value="active">
                Active
            </option>

        </select>

        <button type="submit">
            🤖 Generate Workout Plan
        </button>

    </form>

    <div class="links">

        <a href="/nutrition">
            🍎 Nutrition
        </a>

        <a href="/feedback">
            💬 Feedback
        </a>

        <a href="/tips">
            🌿 Wellness Tips
        </a>

        <a href="/dashboard">
            📊 Dashboard
        </a>

    </div>

</div>

</body>
</html>
