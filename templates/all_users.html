<!DOCTYPE html>
<html>

<head>

<title>All Users</title>

<link rel="stylesheet"
      href="/static/css/style.css">

</head>

<body>

<div class="container">

<h1>👥 All FitBuddy Users</h1>

{% for user in users %}

<div class="user-card">

<h3>{{ user.name }}</h3>

<p>Age: {{ user.age }}</p>

<p>Goal: {{ user.goal }}</p>

<p>Activity: {{ user.intensity }}</p>

</div>

{% else %}

<p>No users found.</p>

{% endfor %}

<br>

<a href="/">
← Home
</a>

</div>

</body>

</html>
